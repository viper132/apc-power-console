[package]
name = "apc-power-console"
version = "1.0.0"
description = "APC Universal Power Telemetry & Management Console"
authors = ["Hugo"]
edition = "2021"

[lib]
name = "apc_power_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
chrono = "0.4"
tauri-plugin-single-instance = "2"
